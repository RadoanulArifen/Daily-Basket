# /etc/nginx/sites-available/vibe-ecommerce
# Replace example.ae with your domain. Certbot adds the HTTPS parts (see docs/deployment.md).

server {
    listen 80;
    listen [::]:80;
    server_name example.ae www.example.ae;

    root /var/www/vibe-ecommerce/public;
    index index.php;
    charset utf-8;

    # Product photos up to 10 MB are accepted by the admin uploader.
    client_max_body_size 12M;

    # Built CSS/JS have a hash in their name, so they can be cached for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Uploaded images (WebP) — each upload gets a new folder, so long caching is safe.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Never serve hidden files (.env, .git …).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
