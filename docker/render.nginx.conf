# Requests forwarded by the Vercel storefront keep its public origin in Laravel.
map $request_uri $basket_request_uri {
    ~^/__daily_basket_frontend(?<basket_path>/.*)$ $basket_path;
    default $request_uri;
}

map $request_uri $basket_public_host {
    ~^/__daily_basket_frontend/ daily-basket-vercel.vercel.app;
    default $http_host;
}

map $http_x_forwarded_proto $render_https {
    default off;
    https on;
}

server {
    listen 10000;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    rewrite ^/__daily_basket_frontend(/.*)$ $1 last;

    location /build/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param REQUEST_URI $basket_request_uri;
        fastcgi_param HTTP_HOST $basket_public_host;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $render_https;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }
}
