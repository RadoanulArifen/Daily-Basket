map $http_x_forwarded_proto $render_https {
    default off;
    https on;
}

server {
    listen 10000;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $render_https;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }
}
